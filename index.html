<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>消失的數字</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light dark;--bg:#e8ece3;--ink:#1d2a2f;--card:#fffdf7;--accent:#6b2d5c;--gold:#e8b13c;--ok:#2b7a4b;--bad:#b23a3a;--mute:#5f6e72}
@media (prefers-color-scheme:dark){:root{--bg:#152026;--ink:#eef1ea;--card:#22323a;--accent:#b4579f;--gold:#e8b13c;--ok:#5fc287;--bad:#ff7d7d;--mute:#9db0b5}}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Avenir Next","Hiragino Maru Gothic ProN","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:24px 20px 40px}
h1{font-size:2.1rem;margin:.2em 0;letter-spacing:.04em}
h2{font-size:1.1rem;margin:1.4em 0 .4em}
.sub{color:var(--mute);margin-top:0}
button{font:inherit;border:0;border-radius:14px;padding:14px 18px;background:var(--accent);color:#fff;font-weight:700;width:100%;margin:8px 0;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
button.link{background:none;color:var(--mute);font-weight:400;text-decoration:underline;width:auto;padding:8px 0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input{font:inherit;font-size:1.5rem;letter-spacing:.3em;text-align:center;width:100%;padding:12px;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.cards{display:flex;gap:14px;justify-content:center;margin:18px 0}
.card{width:88px;height:120px;border-radius:12px;background:var(--card);color:var(--ink);border:2px solid var(--ink);display:grid;place-items:center;font-size:3.2rem;font-weight:800;box-shadow:5px 5px 0 var(--accent)}
.card.gone{border-style:dashed;box-shadow:none;color:var(--mute);background:transparent}
.card.mine{box-shadow:5px 5px 0 var(--ok)}
.role{display:inline-block;background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 14px;font-weight:700}
.code{font-size:2rem;letter-spacing:.2em;font-weight:800}
.timer{font-size:4.2rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0}
.timer.low{color:var(--bad)}
.clue{background:var(--gold);color:#2a2000;border-radius:14px;padding:14px 16px;font-weight:700;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid button{padding:16px 0;font-size:1.5rem;background:var(--card);color:var(--ink);border:2px solid var(--ink);margin:0}
.grid button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.res{font-size:1.8rem;font-weight:800;text-align:center;margin:12px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
ul.log{padding:0;list-style:none;font-size:.92rem;color:var(--mute);margin:0}
ul.log li{padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 15%,transparent)}
ol{padding-left:1.3em;margin:.4em 0}
.cards.sm{gap:8px}.cards.sm .card{width:56px;height:80px;font-size:1.9rem;box-shadow:3px 3px 0 var(--accent)}
.cards.sm .card.mine{box-shadow:3px 3px 0 var(--ok)}.cards.sm .card.gone{box-shadow:none}
.g4{grid-template-columns:repeat(4,1fr)}.grid button.op{font-size:1rem}
.card small{display:block;font-size:.85rem;color:var(--mute);font-weight:700;line-height:1}
.card{align-content:center}
.ov{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom));text-align:center;cursor:pointer}
.ov .pair{font-size:3.4rem;letter-spacing:.3em;color:var(--accent)}
.ov .big{font-size:6rem;font-weight:800;line-height:1.15}
.ov button{max-width:340px}
button:disabled{opacity:.4;cursor:not-allowed}
details{margin:12px 0}summary{cursor:pointer;color:var(--mute)}
.err,.toast{min-height:1.5em;color:var(--bad);font-weight:700}
.toast{color:var(--accent)}
.row{text-align:center;color:var(--mute);margin:16px 0 4px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY='missing-number-v1';
const DEV=new URLSearchParams(location.search).has('dev');
const store=DEV?sessionStorage:localStorage;
let S=load(),hidden=false,err='',toast='';
function load(){try{return JSON.parse(store.getItem(KEY))}catch(e){return null}}
function save(){try{store.setItem(KEY,JSON.stringify(S))}catch(e){}}
function chk(s){const d=s.split('').map(Number);return(d[0]*3+d[1]*7+d[2]*3+d[3]*7+d[4]*3)%10}
function mkCode(){const s=String(Math.floor(Math.random()*100000)).padStart(5,'0');return s+chk(s)}
function valid(c){return/^\d{6}$/.test(c)&&chk(c.slice(0,5))===+c[5]}
function rng(seed){let a=(seed*2654435761)>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function deal(code){const r=rng(parseInt(code.slice(0,5),10)),p=[1,2,3,4,5];
  for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
  const s=x=>x.slice().sort((a,b)=>a-b);
  return{A:s(p.slice(0,2)),B:s(p.slice(2,4)),miss:p[4]}}
function log(m){S.log.push({t:Date.now(),m})}
function clock(t){const d=new Date(t);return[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':')}
function fmt(ms){const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
const $=id=>document.getElementById(id);
let ctx=null,muted=false,lastSec=-1;
function initAudio(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}
function beep(f,d,v,type,delay){if(muted||!ctx||ctx.state!=='running')return;const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+(delay||0);
  o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d)}
function vib(p){try{if(!muted&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function tickSound(sec){
  if(sec>10){if(sec<=30)beep(520,.04,.05,'square')}
  else if(sec>5){beep(660,.09,.2,'square');vib(40)}
  else{beep(880,.09,.28,'square');beep(880,.09,.28,'square',.2);vib([60,80,60])}
}
function endSound(win,timeout){
  if(timeout){beep(150,.9,.35,'sawtooth');vib(400)}
  else if(win){[523,659,784,1046].forEach((f,i)=>beep(f,.25,.25,'triangle',i*.14))}
  else{[392,330,262].forEach((f,i)=>beep(f,.3,.25,'triangle',i*.18))}
}
document.addEventListener('click',initAudio);

function cards(arr,mine){return'<div class="cards">'+arr.map(n=>'<div class="card'+(mine?' mine':'')+'">'+(hidden?'?':n)+'</div>').join('')+'</div>'}

function R(){
  const app=$('app');let h='';
  if(!S){
    h=`<h1>消失的數字</h1>
    <p class="sub">1 到 5 的數字卡少了一張。兩人合作，在 30 秒內推理出消失的是哪一張。</p>
    <ol><li>一人開新局，另一人輸入代碼加入。</li><li>各自看到自己的兩個數字，不能直接說出數字。</li><li>開始計時後才會出現奇偶線索，搭配線索卡自己計算、討論。</li><li>兩人一起碰下認為消失的數字卡。</li></ol>
    <button data-a="new">開新局（我是 A）</button>
    <div class="row">同伴已經開局？</div>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="6 位數代碼" aria-label="房間代碼">
    <button class="ghost" data-a="join">輸入代碼加入（我是 B）</button>
    <div class="err">${err}</div>
    <div class="row">或單機挑戰</div>
    <button class="ghost" data-a="hard">困難版：蓋牌排列（單機，3 分鐘）</button>`;
  }else if(S.mode==='hard'){h=RH()}else{
    const d=deal(S.code),mine=d[S.role],clue='消失的數字是'+(d.miss%2?'奇數':'偶數');
    const head=`<p><span class="role">玩家 ${S.role}</span> 房間 <b>${S.code}</b></p>`;
    if(S.phase==='lobby'){
      h=`${head}<h1>準備好了嗎？</h1>
      <p class="sub">你的兩個數字只有你看得到。確認同伴也已加入後，兩人同時按開始，奇偶線索會在開始後才出現。</p>
      ${cards(mine,true)}
      <button class="ghost" data-a="hide">${hidden?'顯示數字':'蓋住數字'}</button>
      <button data-a="start">開始計時（30 秒）</button>
      <button class="link" data-a="reset">放棄這局</button>`;
    }else if(S.phase==='play'){
      h=`${head}<div class="timer" id="tm">${fmt(Math.max(0,S.end-Date.now()))}</div>
      ${cards(mine,true)}
      <button class="ghost" data-a="hide">${hidden?'顯示數字':'蓋住數字'}</button>
      <button class="link" data-a="mute">${muted?'開啟音效':'關閉音效'}</button>
      <div class="clue">線索：${clue}</div>
      <h2>提交答案：哪一張消失了？</h2>
      <div class="toast">${toast}</div>
      <div class="grid">${[1,2,3,4,5].map(n=>`<button data-a="sel" data-v="${n}" class="${S.sel===n?'sel':''}">${n}</button>`).join('')}</div>
      <button data-a="submit" ${S.sel?'':'disabled style="opacity:.4"'}>${S.sel?'確認答案：'+S.sel:'先選一個數字'}</button>`;
    }else{
      const win=S.ans===d.miss;
      h=`${head}<div class="res ${win?'ok':'bad'}">${S.ans==null?'時間到！':win?'答對了！':'答錯了'}</div>
      <p class="sub" style="text-align:center">消失的數字是 ${d.miss}${S.ans!=null&&!win?'，你們選了 '+S.ans:''}</p>
      <div class="cards">${[1,2,3,4,5].map(n=>`<div class="card${n===d.miss?' gone':''}">${n===d.miss?'?':n}</div>`).join('')}</div>
      <p class="sub" style="text-align:center">A：${d.A.join('、')}　B：${d.B.join('、')}</p>
      <h2>推理紀錄</h2><ul class="log">${S.log.map(e=>`<li>${clock(e.t)}　${e.m}</li>`).join('')}</ul>
      <button data-a="reset">再玩一局</button>`;
    }
  }
  app.innerHTML=h;
}

function act(a,v){
  if(a==='hard'||(S&&S.mode==='hard'&&!['reset','hide','mute'].includes(a)))return actH(a,v);
  if(a==='new'){S={code:mkCode(),role:'A',phase:'lobby',log:[],sel:null,end:0};log('開新局，我是 A');err=''}
  else if(a==='join'){const c=($('code').value||'').trim();
    if(!valid(c)){err='代碼不正確，請對照同伴畫面上的 6 位數再輸入。';R();return}
    S={code:c,role:'B',phase:'lobby',log:[],sel:null,end:0};log('加入房間，我是 B');err=''}
  else if(a==='start'){S.phase='play';S.end=Date.now()+30000;lastSec=-1;initAudio();log('開始計時');toast=''}
  else if(a==='sel'){S.sel=+v;toast=''}
  else if(a==='submit'){if(!S.sel)return;finish(S.sel);return}
  else if(a==='hide'){hidden=!hidden;R();return}
  else if(a==='mute'){muted=!muted;R();return}
  else if(a==='reset'){if(S&&S.phase!=='done'&&!confirm('要放棄這局嗎？'))return;S=null;toast='';try{store.removeItem(KEY)}catch(e){}R();return}
  save();R()
}
function finish(ans){S.phase='done';S.ans=ans;endSound(ans!=null&&ans===deal(S.code).miss,ans==null);log(ans==null?'時間到，沒有提交答案':'提交答案 '+ans);save();R()}


// ===== 困難版（單機）=====
const OPN={cmp:'比大小',diff:'相減',sum:'相加',prod:'相乘'};
const SYM=['★','●','▲','◆','■'];
function spUsed(){return S.q.some(x=>x.o==='sum'||x.o==='prod')}
function togglePos(p){
  const i=S.sel.indexOf(p);
  if(i>=0)S.sel.splice(i,1);else if(S.sel.length<2)S.sel.push(p);
  S.sel.sort((a,b)=>a-b);
  toast=S.sel.length?'已選 '+S.sel.map(k=>SYM[k-1]).join(' '):'';
}
function scanH(n){
  if(S.phase==='scan'){
    if(S.seq.includes(n)){toast='這張已經掃過了'}
    else if(S.seq.length<5){S.seq.push(n);toast='已記錄 '+SYM[S.seq.length-1]}
  }else if(S.phase==='play'){
    const p=S.seq.indexOf(n)+1;if(p)togglePos(p);
  }
  save();
}
function finishH(timeout){S.phase='done';S.timeout=timeout;S.pop=null;endSound(!timeout,timeout);log(timeout?'時間到':'提前揭曉');save();R()}
function actH(a,v){
  if(a==='hard'){S={mode:'hard',phase:'scan',seq:[],q:[],sel:[],op:null,pop:null,log:[],end:0};log('開始困難版');toast=''}
  else if(a==='scanman'){scanH(+v)}
  else if(a==='undo'){S.seq.pop();toast=''}
  else if(a==='hstart'){if(S.seq.length<5)return;S.phase='play';S.end=Date.now()+180000;lastSec=-1;initAudio();log('開始倒數 3 分鐘');toast=''}
  else if(a==='pos'){togglePos(+v)}
  else if(a==='op'){S.op=v}
  else if(a==='close'){S.pop=null}
  else if(a==='ask'){
    const o=S.op;
    if(S.sel.length!==2||!o||S.q.length>=5||((o==='sum'||o==='prod')&&spUsed()))return;
    const [x,y]=S.sel,A=S.seq[x-1],B=S.seq[y-1];
    let t,val;
    if(o==='cmp'){const big=A>B?x:y,sm=A>B?y:x;t=SYM[big-1]+' 比較大';val=SYM[big-1]+' ＞ '+SYM[sm-1]}
    else{val=String(o==='diff'?Math.abs(A-B):o==='sum'?A+B:A*B);t=(o==='diff'?'差 ':o==='sum'?'和 ':'積 ')+val}
    S.q.push({x,y,o,t,v:val});S.pop=S.q.length-1;
    log(SYM[x-1]+'、'+SYM[y-1]+' '+OPN[o]+'：'+t);S.sel=[];S.op=null;toast='';beep(740,.08,.2,'triangle');vib(60);
  }
  else if(a==='reveal'){if(!confirm('確定要揭曉答案嗎？'))return;finishH(false);return}
  save();R();
}
function qlist(){return S.q.length?S.q.map(q=>'<li>'+SYM[q.x-1]+'、'+SYM[q.y-1]+'　'+OPN[q.o]+'：<b>'+q.t+'</b></li>').join(''):'<li>還沒有提問</li>'}
function RH(){
  const head='<p><span class="role">困難版</span></p>',five=[1,2,3,4,5];
  if(S.phase==='scan'){
    const n=S.seq.length;
    return head+`<h1>依序掃描牌</h1><p class="sub">牌洗好、蓋著，從左到右放在 ${SYM.join(' ')} 的位置，再一張張碰。畫面不會顯示牌上的數字。</p>
    <div class="cards sm">${[0,1,2,3,4].map(i=>'<div class="card '+(i<n?'mine':'gone')+'">'+SYM[i]+'</div>').join('')}</div>
    <div class="toast">${toast}</div>
    ${n===5?'<button data-a="hstart">開始倒數 3 分鐘</button>':''}
    ${n?'<button class="ghost" data-a="undo">重掃上一張</button>':''}
    <details><summary>沒有 NFC？手動輸入（會看到數字）</summary><div class="grid" style="margin-top:8px">${five.map(k=>`<button data-a="scanman" data-v="${k}" ${S.seq.includes(k)?'disabled':''}>${k}</button>`).join('')}</div></details>
    <button class="link" data-a="reset">放棄</button>`;
  }
  if(S.phase==='play'){
    const left=5-S.q.length,sp=spUsed(),ok=S.sel.length===2&&S.op&&left>0,t=fmt(Math.max(0,S.end-Date.now()));
    let ov='';
    if(S.pop!=null&&S.q[S.pop]){const q=S.q[S.pop];
      ov=`<div class="ov" data-a="close"><div class="timer" id="tm2" style="font-size:2rem;color:var(--mute)">${t}</div>
      ${q.o==='cmp'?'':`<div class="pair">${SYM[q.x-1]} ${SYM[q.y-1]}</div>`}
      <div class="sub">${OPN[q.o]}</div><div class="big">${q.v}</div>
      <button data-a="close">關閉，繼續推理</button></div>`}
    return head+`<div class="timer" id="tm">${t}</div>
    <h2>選兩張牌（碰牌，或按符號）</h2>
    <div class="grid">${five.map(k=>`<button data-a="pos" data-v="${k}" class="${S.sel.includes(k)?'sel':''}" style="font-size:1.6rem">${SYM[k-1]}</button>`).join('')}</div>
    <h2>怎麼問？剩 ${left} 次</h2>
    <div class="grid g4">${Object.keys(OPN).map(o=>`<button class="op ${S.op===o?'sel':''}" data-a="op" data-v="${o}" ${sp&&(o==='sum'||o==='prod')?'disabled':''}>${OPN[o]}</button>`).join('')}</div>
    <p class="sub" style="margin:6px 0">相加、相乘只能擇一，且只能用一次。</p>
    <div class="toast">${toast}</div>
    <button data-a="ask" ${ok?'':'disabled'}>${left?'詢問':'已問完 5 次'}</button>
    <h2>已問過</h2><ul class="log">${qlist()}</ul>
    <button class="ghost" data-a="reveal" style="margin-top:16px">我推完了，揭曉</button>
    <button class="link" data-a="mute">${muted?'開啟音效':'關閉音效'}</button>${ov}`;
  }
  return head+`<div class="res ${S.timeout?'bad':'ok'}">${S.timeout?'時間到！':'揭曉'}</div>
  <p class="sub" style="text-align:center">每個位置的數字</p>
  <div class="cards sm">${S.seq.map((n,i)=>'<div class="card"><small>'+SYM[i]+'</small>'+n+'</div>').join('')}</div>
  <p class="sub" style="text-align:center">現在可以把牌翻開對答案。</p>
  <h2>提問紀錄</h2><ul class="log">${qlist()}</ul>
  <button data-a="reset">再玩一局</button>`;
}

$('app').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});

setInterval(()=>{
  if(!S||S.phase!=='play')return;
  const left=S.end-Date.now(),el=$('tm'),sec=Math.ceil(left/1000);
  if(left<=0){S.mode==='hard'?finishH(true):finish(null);return}
  if(sec!==lastSec){lastSec=sec;tickSound(sec)}
  if(el){el.textContent=fmt(left);el.classList.toggle('low',left<=10000)}
  const e2=$('tm2');if(e2)e2.textContent=fmt(left);
},250);

// NFC 標籤網址：?n=3 會把該數字帶入「提交答案」
(function(){
  const n=+new URLSearchParams(location.search).get('n');
  if(!n)return;
  try{history.replaceState(null,'',location.pathname+(DEV?'?dev':''))}catch(e){}
  if(n<1||n>5)return;
  if(S&&S.mode==='hard'){scanH(n);return}
  if(S&&S.phase==='play'){S.sel=n;save();toast='讀到數字 '+n+'，確認後提交'}
  else if(S&&S.phase==='lobby'){toast=''}
  else if(!S){err='沒有進行中的局，先開新局或輸入代碼。'}
})();
R();
</script>
</body>
</html>
